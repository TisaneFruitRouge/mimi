<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Small-size app icon (16 and 32 px): the same character without shine, cheeks, mouth or
    highlights, and slightly larger. macOS grid: an 824 px continuous-corner square (radius
    185.4) centred on a 1024 px canvas, with a soft drop shadow. The character is the
    resting pose of components/assistant-avatar.tsx; keep them in step.
    Regenerate the icon set from apps/desktop (see icons/source/regenerate.sh).
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f98f"/>
      <stop offset="1" stop-color="#b4e140"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset=".35" stop-color="#ff8aa5" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff8aa5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#f1efe6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
