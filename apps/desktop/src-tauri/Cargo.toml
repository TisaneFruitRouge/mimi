[package]
name = "mimi-desktop"
description = "mimi desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash, see https://github.com/rust-lang/cargo/issues/8519
name = "mimi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
mimi-client = { path = "../../../crates/client" }
mimi-protocol = { path = "../../../crates/protocol" }
tokio = { version = "1.53.1", features = ["time"] }
futures = "0.3.34"
serde_json = "1.0.151"
tauri-plugin-opener = "2.5.5"

[lints]
workspace = true
