[package]
name = "mimi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3.34"
getrandom = "0.4.3"
mimi-protocol = { version = "0.1.0", path = "../protocol" }
icalendar = { version = "0.17.13", features = ["recurrence", "chrono-tz"] }
jiff = "0.2.37"
keyring = "4.2.0"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.38.4"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "io-util"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
notify-rust = "4.17.0"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11.9"
html2text = "0.17.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "builder", "rustls-platform-verifier", "aws-lc-rs"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-platform-verifier = "0.7"

[lints]
workspace = true

[dev-dependencies]
base64 = "0.22.1"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "mimid"
path = "src/main.rs"
