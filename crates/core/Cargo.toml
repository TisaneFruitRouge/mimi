[package]
name = "mimi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3.34"
getrandom = "0.4.3"
mimi-protocol = { version = "0.1.0", path = "../protocol" }
icalendar = { version = "0.17.13", features = ["recurrence", "chrono-tz"] }
jiff = "0.2.37"
keyring = "4.2.0"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.38.4"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "io-util"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
notify-rust = "4.17.0"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11.9"
html2text = "0.17.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "builder", "rustls-platform-verifier", "aws-lc-rs"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-platform-verifier = "0.7"
hickory-resolver = { version = "0.26.3", features = ["tokio", "system-config"] }
ammonia = "4.2.0"
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"
base64 = "0.22.1"
url = "2"
# Signal as a linked device. AGPL-3.0-only, pinned to an exact revision; without the
# `cdsi` feature (it needs BoringSSL and a forked SQLite).
presage = { git = "https://github.com/whisperfish/presage", rev = "33dd1491130793390e356e15a5711f1e6ca14fdb", default-features = false }
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Photos sent to the assistant: decoded, shrunk and saved again without metadata.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Voice: speech recognition and speech on this computer (sherpa-onnx links its prebuilt
# static libraries: onnxruntime, espeak-ng (GPL-3.0), kaldi). Voice notes are decoded with
# symphonia (MPL-2.0) plus libopus, and replies encoded as Ogg/Opus.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "wav", "mkv", "isomp4", "aac", "mp3", "vorbis", "flac", "pcm", "caf"] }
symphonia-adapter-libopus = "0.3.0"
opus = "0.4.0"
ogg = "0.9.2"
bzip2 = "0.6.1"
tar = { version = "0.4.46", default-features = false }
whatlang = "0.18.0"
mime = "0.3.17"
sys-locale = "0.3.2"

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
http-body-util = "0.1.5"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "mimid"
path = "src/main.rs"
